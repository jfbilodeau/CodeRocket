name: CodeRocket - Build and test

env:
  BUILD_CONFIGURATION: Release
  PUBLISH_DIRECTORY: ${{ github.workspace }}/publish
  PACKAGE_PATH: ${{ github.workspace }}/CodeRocket.zip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CodeRocket.csproj

      - name: Build
        run: dotnet build CodeRocket.csproj --configuration $BUILD_CONFIGURATION --no-restore

      - name: Run unit tests
        run: dotnet test CodeRocket.csproj --configuration $BUILD_CONFIGURATION --no-build

      - name: Publish production build
        run: dotnet publish CodeRocket.csproj --configuration $BUILD_CONFIGURATION --no-build --output $PUBLISH_DIRECTORY

      - name: Create deployment package
        run: zip -r $PACKAGE_PATH .
        working-directory: ${{ env.PUBLISH_DIRECTORY }}

      - name: Save deployment package
        uses: actions/upload-artifact@v4
        with:
          name: CodeRocket-deployment-package
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

  deploy:
    name: Deploy to Azure
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in with federated identity
        uses: azure/login@v3
        with:
          client-id: 540c4e9c-0a5a-49b8-b3f3-c36d09bccea0
          tenant-id: 14f08b43-3b8c-4f1c-87c5-71e2bb2177f3
          subscription-id: 6fbbcbd7-1450-4e1c-b5b9-f2eb39d50536

      # - name: Preview infrastructure changes
      #   uses: azure/cli@v2
      #   with:
      #     inlineScript: |
      #       az deployment group what-if \
      #         --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
      #         --template-file main.bicep \
      #         --parameters @main.parameters.json

      - name: Deploy infrastructure
        id: deploy-infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: CodeRocketProd
          template: main.bicep
          parameters: main.parameters.json
          deploymentName: coderocket-production
          deploymentMode: Incremental

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: CodeRocket-deployment-package
          path: ${{ github.workspace }}

      - name: Deploy application package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.deploy-infrastructure.outputs.webAppName }}
          package: ${{ env.PACKAGE_PATH }}
